name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  library:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build library and run tests (Android + iOS targets)
        run: ./gradlew build

  template:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Shared tests + Android app
        working-directory: template
        run: ./gradlew :shared:testDebugUnitTest :androidApp:assembleDebug
      - name: iOS app (simulator)
        working-directory: template/iosApp
        run: |
          xcodebuild -project iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
